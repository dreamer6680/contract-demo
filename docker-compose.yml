services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: contract-demo-onlyoffice
    profiles: ["onlyoffice"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8081:80"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-dev-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: contract-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: contract_demo
      MYSQL_USER: contract
      MYSQL_PASSWORD: contractpass
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: contract-demo-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contract_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: contract
      SPRING_DATASOURCE_PASSWORD: contractpass
      APP_STORAGE_DIR: /app/storage
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-dev-secret-change-me}
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://localhost:8081
      ONLYOFFICE_DOCUMENT_URL_BASE: http://host.docker.internal:8080
      ONLYOFFICE_CALLBACK_URL_BASE: http://backend:8080
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
    ports: ["8080:8080"]
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: contract-demo-frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mysql_data:
